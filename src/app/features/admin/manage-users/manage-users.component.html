<div class="bg-white border border-slate-200 rounded-xl shadow-md overflow-hidden">
  <div class="p-6 border-b border-slate-200 bg-linear-to-r from-slate-50 to-slate-100/50">
    <h4 class="text-sm font-bold uppercase tracking-widest bg-linear-to-r from-purple-600 via-indigo-600 to-pink-600 bg-clip-text text-transparent">
      Admin User Management
    </h4>
  </div>

  <div class="overflow-x-auto">
    <table class="min-w-full divide-y divide-slate-200">
      <thead class="bg-slate-50">
        <tr>
          <th class="px-6 py-3.5 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">User ID</th>
          <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Name</th>
          <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Security Role</th>
          <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-200 bg-white">
        @for (user of users; track user.userId) {
          <tr class="hover:bg-slate-50 transition-colors duration-150">
            <td class="px-6 py-4 whitespace-nowrap text-sm font-mono text-indigo-600">{{ user.userId }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-900 font-medium">{{ user.name }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-600">
              <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-mono border"
                    [ngClass]="user.role === 'Admin' ? 'bg-purple-50 text-purple-700 border-purple-200' : 'bg-blue-50 text-blue-700 border-blue-200'">
                {{ user.role }}
              </span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-600">
              <button class="text-xs cursor-pointer bg-slate-50 hover:bg-linear-to-r hover:from-purple-600 hover:to-indigo-600 border border-slate-300 hover:text-white font-medium px-3 py-1.5 rounded-md shadow-xs transition-all duration-200 hover:border-transparent">
                Modify
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
